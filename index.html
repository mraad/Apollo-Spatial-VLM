<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odyseus-Spatial VLM Demo</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.186.1/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.186.1/examples/jsm/",
          "@sparkjsdev/spark": "https://unpkg.com/@sparkjsdev/spark@2.3.1/dist/spark.module.js"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0f12;
        --panel: #161a20;
        --panel-2: #1f252d;
        --border: #2c3440;
        --text: #eef2f7;
        --muted: #98a3b3;
        --accent: #7cc7ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font: 14px/1.4 system-ui, sans-serif;
      }

      .app {
        display: grid;
        grid-template-columns: 340px 1fr;
        min-height: 100vh;
      }

      .sidebar,
      .viewer-wrap {
        padding: 20px;
      }

      .sidebar {
        border-right: 1px solid var(--border);
        background: linear-gradient(180deg, #14181e 0%, #0f1317 100%);
      }

      h1,
      h2,
      p,
      pre {
        margin: 0;
      }

      h1 {
        font-size: 20px;
        margin-bottom: 6px;
      }

      .muted {
        color: var(--muted);
      }

      .stack {
        display: grid;
        gap: 14px;
        margin-top: 18px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 14px;
      }

      label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 6px;
      }

      input,
      textarea,
      button {
        width: 100%;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: var(--panel-2);
        color: var(--text);
        padding: 10px 12px;
      }

      button {
        cursor: pointer;
        background: #243141;
        border-color: #314153;
        color: var(--accent);
        font-weight: 600;
      }

      .toggle {
        display: flex;
        gap: 8px;
        align-items: center;
        font-size: 13px;
        color: var(--text);
        margin: 0;
      }

      .toggle input {
        width: auto;
      }

      button:disabled {
        cursor: progress;
        opacity: 0.7;
      }

      .spinner {
        width: 16px;
        height: 16px;
        border: 2px solid var(--accent);
        border-right-color: transparent;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation-duration: 2.4s;
        }
      }

      .busy {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: rgba(9, 11, 15, 0.55);
        z-index: 1;
      }

      .busy[hidden] {
        display: none;
      }

      .busy-card {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: var(--panel);
      }

      .busy-elapsed {
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      textarea {
        min-height: 84px;
        resize: vertical;
      }

      .grid {
        display: grid;
        gap: 10px;
        grid-template-columns: 1fr 1fr;
      }

      .preview {
        width: 100%;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #0b0d10;
        object-fit: contain;
        aspect-ratio: 1.2;
      }

      .upload-thumb {
        width: 100%;
        height: 180px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: #0b0d10;
        object-fit: contain;
        margin-top: 12px;
      }

      img:not([src]) {
        display: none;
      }

      .placeholder {
        display: none;
        place-items: center;
        padding: 12px;
        border-style: dashed;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      img:not([src]) + .placeholder {
        display: grid;
      }

      .viewer-wrap {
        display: grid;
        gap: 14px;
        background: radial-gradient(circle at top, #161d26 0%, #0d0f12 55%);
        /* Fit the window and stay put while the sidebar scrolls, so the scene and busy overlay are centred on screen. */
        position: sticky;
        top: 0;
        height: 100vh;
      }

      #viewer {
        position: relative;
        min-height: 62vh;
        border-radius: 16px;
        border: 1px solid var(--border);
        overflow: hidden;
        background: #090b0f;
      }

      pre {
        white-space: pre-wrap;
        color: #cfe0f5;
      }

      .target-list {
        display: grid;
        gap: 8px;
      }

      .target-item {
        display: grid;
        grid-template-columns: 12px 1fr;
        gap: 10px;
        align-items: start;
        color: #cfe0f5;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
      }

      .target-swatch {
        width: 12px;
        height: 12px;
        border-radius: 999px;
        margin-top: 2px;
      }

      @media (max-width: 980px) {
        .app {
          grid-template-columns: 1fr;
        }

        .sidebar {
          border-right: 0;
          border-bottom: 1px solid var(--border);
        }

        .viewer-wrap {
          position: static;
          height: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <h1>Odyseus-Spatial VLM Demo</h1>
        <p class="muted">Upload one image, infer metric depth, project it into a point cloud, and inspect it in Three.js.</p>

        <form id="demo-form" class="stack">
          <div class="panel">
            <label for="image">Image</label>
            <input id="image" name="image" type="file" accept="image/*" required />
            <img id="upload-preview" class="upload-thumb" alt="Upload preview" />
            <div class="upload-thumb placeholder">No image selected</div>
          </div>

          <div class="panel">
            <label for="prompt">Prompt</label>
            <textarea id="prompt" name="prompt" placeholder="Example: select the chair I could sit on, the monitor on the desk, and the nearest door"></textarea>
          </div>

          <label class="toggle"><input id="splats" type="checkbox" checked /> Gaussian splats (built in the browser)</label>

          <button id="submit" type="submit">Run Demo</button>

          <div class="panel">
            <label>Status</label>
            <pre id="status">Idle.</pre>
          </div>
        </form>

        <div class="stack">
          <div class="panel">
            <label>Depth Preview</label>
            <img id="depth-preview" class="preview" alt="Depth preview" />
            <div class="preview placeholder">The depth map appears here after a run</div>
          </div>
          <div class="panel">
            <label>Prompt Targets</label>
            <img id="annotated-preview" class="preview" alt="Annotated preview" />
            <div class="preview placeholder">Prompt targets appear here after a run with a prompt</div>
          </div>
          <div class="panel">
            <label>Targets</label>
            <div id="meta" class="target-list">No targets yet.</div>
          </div>
        </div>
      </aside>

      <main class="viewer-wrap">
        <div id="viewer">
          <div id="busy" class="busy" hidden>
            <div class="busy-card" role="status">
              <span class="spinner" aria-hidden="true"></span>
              <span id="busy-text">Running</span>
              <span id="busy-elapsed" class="busy-elapsed" aria-hidden="true"></span>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/index.js"></script>
  </body>
</html>
